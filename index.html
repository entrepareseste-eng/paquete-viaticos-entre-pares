<script>
const state={1:{},2:{},3:{},4:{}};
let current=1;

const configs={

  const d=document.createElement("div"); d.className="field";

  let dates=[];
  function parseDate(s){
    const m=(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if(!m) return null;
    return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));

  const a=parseDate(fs), b=parseDate(fr);

  const missionEnd=`${misionHastaDia || "____"} DE ${misionHastaMes || "____________"} DE ${misionHastaAnio || "______"}`;

function renderPaper(){
 const paper=document.getElementById("paper");
 paper.className="paper "+(current===4?"legal":current===3?"a4":"letter"); if(current===4) paper.style.page="form4legal";
 paper.innerHTML=current===1?form1():current===2?form2():current===3?form3():form4();
}
function switchForm(n){
 current=n; document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("active",+b.dataset.form===n));
 document.getElementById("panelTitle").textContent=configs[n].title; renderFields(); renderPaper();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>switchForm(+b.dataset.form)));
document.getElementById("clear").addEventListener("click",()=>{state[current]={};renderFields();renderPaper()});
document.getElementById("print").addEventListener("click",()=>window.print());

switchForm(1);
</script>
